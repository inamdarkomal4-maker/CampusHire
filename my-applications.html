<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Applications - CampusHire</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .applications-page {
            min-height: 100vh;
            padding: 50px 20px;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
        }

        .applications-page h1 {
            text-align: center;
            color: #172554;
            margin-bottom: 35px;
        }

        #applications-container {
            max-width: 900px;
            margin: auto;
        }

        .application-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .application-card h2 {
            margin-top: 0;
            color: #1e3a8a;
        }

        .application-card p {
            color: #475569;
            margin: 10px 0;
        }

        .status {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-weight: bold;
        }

        .empty-box {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 18px;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        CampusHire
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="jobs.html">Jobs</a>
        <a href="my-applications.html">My Applications</a>
    </nav>

</header>


<section class="applications-page">

    <h1>My Applications</h1>

    <div id="applications-container">
        <p style="text-align:center;">
            Loading applications...
        </p>
    </div>

</section>


<script>

async function loadApplications() {

    const container =
        document.getElementById("applications-container");

    try {
     const loggedInUser =
    JSON.parse(localStorage.getItem("loggedInUser"));

if (!loggedInUser) {
    window.location.href = "login.html";
    return;
}

const response = await fetch(
    `/api/applications?email=${encodeURIComponent(loggedInUser.email)}`
);
        
        const applications =
            await response.json();


        if (applications.length === 0) {

            container.innerHTML = `
                <div class="empty-box">
                    <h2>No Applications Yet</h2>
                    <p>
                        Apply for a job to see your
                        applications here.
                    </p>
                </div>
            `;

            return;
        }


        container.innerHTML = "";


        applications.forEach(application => {

            container.innerHTML += `

                <div class="application-card">

                    
                        <h2>${application.jobTitle || "Job Application"}</h2>

                         <p>
                             <strong>Company:</strong>
                            ${application.company }
                            </p>
                    

                    <p>
                        <strong>Name:</strong>
                        ${application.name}
                    </p>

                    <p>
                        <strong>Email:</strong>
                        ${application.email}
                    </p>

                    <p>
                        <strong>Phone:</strong>
                        ${application.phone}
                    </p>

                    <p>
                        <strong>Resume:</strong>

                        <a
                            href="${application.resume}"
                            target="_blank">
                            View Resume
                        </a>

                    </p>

                    <p>
                        <strong>Status:</strong>

                        <span class="status">
                            ${application.status}
                        </span>

                    </p>

                    <p>
                        <strong>Applied On:</strong>
                        ${new Date(
                            application.appliedAt
                        ).toLocaleDateString()}
                    </p>

                </div>

            `;

        });

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty-box">
                <h2>Unable to load applications</h2>
                <p>
                    Please make sure the server is running.
                </p>
            </div>
        `;
    }
}


loadApplications();

</script>

</body>

</html>
