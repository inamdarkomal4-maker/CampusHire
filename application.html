<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply for Job - CampusHire</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">CampusHire</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="jobs.html">Jobs</a>
            <a href="my-applications.html">My Applications</a>
        </nav>
    </header>


    <section class="application-section">

        <div class="application-box">

            <h1 id ="applicationTitle">Apply for internship</h1>

            <p class="application-subtitle">
                Complete the form below to submit your application.
            </p>

            <form id="applicationForm">

                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >

                <label>Resume Link</label>
                <input
                    type="url"
                    id="resume"
                    placeholder="Enter your resume link"
                    required
                >

                <label>Cover Letter</label>
                <textarea
                    id="coverLetter"
                    rows="6"
                    placeholder="Write a short cover letter..."
                    required
                ></textarea>

                <button type="submit">
                    Submit Application
                </button>

            </form>

            <p id="message"></p>

        </div>

    </section>
<script>
const form = document.getElementById("applicationForm");
const urlParams = new URLSearchParams(window.location.search);

const jobId = urlParams.get("id");
const jobTitle = urlParams.get("title");
const company = urlParams.get("company");
const category = urlParams.get("category");


const applicationTitle =
    document.getElementById("applicationTitle");

if (urlParams.get("category") === "Internship") {
    applicationTitle.textContent = "Apply for Internship";
} else {
    applicationTitle.textContent = "Apply for Job";
}
form.addEventListener("submit", async function (event) {

    event.preventDefault();
    const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));

    
    const applicationData = {
        userEmail: loggedInUser ? loggedInUser.email: "",
        jobId: jobId,
        jobTitle: jobTitle,
        company: company,
        

        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        resume: document.getElementById("resume").value,
        coverLetter: document.getElementById("coverLetter").value 
        
    };

    try {

        const response = await fetch(
            "http://localhost:5000/api/applications",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(applicationData)
            }
        );

        const result = await response.json();

        if (response.ok) {

            document.getElementById("message").innerText =
                "Application submitted successfully!";

            form.reset();

        } else {

            document.getElementById("message").innerText =
                result.message || "Failed to submit application.";

        }

    } catch (error) {

        console.error(error);

        document.getElementById("message").innerText =
            "Server connection failed.";

    }

});
</script>

    


                        
    

</body>

</html>
